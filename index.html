<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ಹಿಂದಿ ಅಕ್ಷರ ಟ್ರ್ಯಾಕರ್</title>

<!-- ಮೊಬೈಲ್‌ ಆಪ್‌ ರೀತಿ ಕಾಣಿಸಲು (ಹೋಮ್ ಸ್ಕ್ರೀನ್‌ಗೆ ಸೇರಿಸಿದಾಗ) -->
<meta name="theme-color" content="#e08b2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ಹಿಂದಿ ಅಕ್ಷರ ಟ್ರ್ಯಾಕರ್">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@500;700&family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<style>
  :root{
    --board:#faf3e2;
    --board-dark:#f1e0ba;
    --chalk:#3d2b1a;
    --chalk-dim:#8a7360;
    --amber:#e08b2e;
    --amber-dark:#c8752a;
    --red:#c0392b;
    --red-dark:#a52f22;
    --green:#4caf7d;
    --green-dark:#37905f;
    --gray:#6e5c50;
    --panel:#ffffff;
    --line:#e8d6ab;
  }
  *{box-sizing:border-box;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    font-family:'Noto Sans Kannada','Baloo 2',sans-serif;
    background:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.4), transparent 40%),
      var(--board);
    color:var(--chalk);
    min-height:100vh;
    padding-bottom:calc(60px + env(safe-area-inset-bottom));
    overscroll-behavior-y:contain;
    -webkit-tap-highlight-color:transparent;
  }
  header{
    padding:calc(22px + env(safe-area-inset-top)) 24px 16px;
    border-bottom:3px dashed var(--line);
    background:var(--board);
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
  header h1{
    font-family:'Baloo 2',sans-serif;
    font-size:26px;
    margin:0;
    letter-spacing:0.5px;
    color:var(--amber);
    font-weight:700;
  }
  header .sub{color:var(--chalk-dim);font-size:13px;}
  .wrap{max-width:1180px;margin:0 auto;padding:20px;}
  .card{
    background:var(--panel);
    border:2px solid var(--line);
    border-radius:14px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 4px 14px rgba(120,90,40,0.08);
  }
  .card h2{
    margin:0 0 12px;
    font-size:16px;
    color:var(--amber-dark);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:9px;
    padding:9px 16px;
    font-size:14px;
    font-weight:600;
    transition:transform .08s ease, filter .12s ease;
  }
  button:active{transform:scale(0.96);}
  button:disabled{opacity:0.45;cursor:not-allowed;}
  button:disabled:active{transform:none;}
  .btn-amber{background:var(--amber);color:#fff;}
  .btn-amber:hover{filter:brightness(1.08);}
  .btn-outline{background:transparent;border:1.5px solid var(--amber);color:var(--amber-dark);}
  .btn-outline:hover{background:rgba(224,139,46,0.12);}
  .btn-ghost{background:#f2e4c3;color:var(--chalk);}
  .btn-ghost:hover{background:#ecdcb5;}
  .btn-danger{background:var(--red);color:#fff;}
  .btn-green{background:var(--green);color:#fff;}
  input[type=text], input[type=search], select{
    font-family:inherit;
    background:#fff;
    border:1.5px solid var(--line);
    color:var(--chalk);
    padding:9px 12px;
    border-radius:9px;
    font-size:14px;
  }
  input::placeholder{color:var(--chalk-dim);}
  .class-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .class-tab{
    padding:8px 14px;border-radius:20px;background:var(--gray);
    border:1.5px solid var(--gray);color:#fff;font-weight:600;font-size:13px;
  }
  .class-tab.active{background:var(--amber);color:#fff;border-color:var(--amber);}
  .class-tab.locked{opacity:0.55;}
  .student-list{display:flex;flex-wrap:wrap;gap:8px;max-height:220px;overflow-y:auto;padding:4px 2px;}
  .empty-note{color:var(--chalk-dim);font-size:13px;padding:8px 0;}
  .active-bar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:#fdf6e6;border-radius:10px;padding:12px 16px;margin-bottom:16px;
    border-left:4px solid var(--amber);
  }
  .active-bar .name{font-weight:800;font-size:17px;color:var(--amber-dark);}
  .cls-badge{font-size:12px;color:var(--chalk-dim);background:rgba(0,0,0,0.06);padding:3px 8px;border-radius:6px;}
  .group-badge{font-size:12.5px;color:#fff;background:var(--green);padding:3px 10px;border-radius:6px;font-weight:700;}
  .group-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .group-pill{background:#f2e4c3;color:var(--chalk-dim);border:1.5px solid var(--line);font-size:13px;padding:8px 14px;}
  .group-pill.active{background:var(--amber);color:#fff;border-color:var(--amber);}
  .group-pill.done{border-color:var(--green);}
  .letter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin-bottom:16px;}
  .letter-tile{
    aspect-ratio:1;border-radius:12px;font-weight:700;
    font-family:'Noto Sans Devanagari','Noto Sans Kannada',sans-serif;
    font-size:30px;background:var(--red);color:#fff;border:none;padding:0;
    display:flex;align-items:center;justify-content:center;
  }
  .letter-tile.green{background:var(--green);color:#fff;}
  .progress-note{color:var(--chalk-dim);font-size:13px;margin-bottom:14px;}
  .promo-box{
    background:#fdf6e6;border:1.5px dashed var(--green);border-radius:12px;padding:16px;
    text-align:center;margin-bottom:16px;
  }
  .promo-box.locked{border-color:var(--line);}
  .promo-box p{margin:0 0 10px;font-size:14px;color:var(--chalk);}
  .placeholder{color:var(--chalk-dim);text-align:center;padding:30px 0;font-size:14px;}
  .modal-bg{
    position:fixed;inset:0;background:rgba(60,40,20,0.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;
  }
  .modal{
    background:#fff;border:2px solid var(--line);border-radius:14px;padding:22px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;
  }
  .modal h3{margin-top:0;color:var(--amber-dark);}
  .name-line{display:flex;justify-content:space-between;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line);font-size:14px;color:var(--chalk);}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--green);color:#fff;padding:10px 20px;border-radius:10px;font-weight:700;
    box-shadow:0 4px 14px rgba(0,0,0,0.2);z-index:60;font-size:14px;
  }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}
  @media (max-width:520px){
    .letter-grid{grid-template-columns:repeat(4, 1fr);}
    .letter-tile{font-size:24px;}
  }
</style>
</head>
<body>
<header>
  <h1>🔤 ಹಿಂದಿ ಅಕ್ಷರ ಟ್ರ್ಯಾಕರ್</h1>
  <div class="sub">ಪ್ರತಿ ಮಗುವಿನ ಹಿಂದಿ ಅಕ್ಷರ ಕಲಿಕೆಯ ಪ್ರಗತಿಯನ್ನು ಗುಂಪುಗಳ ಮೂಲಕ ಪತ್ತೆ ಹಚ್ಚಿ</div>
</header>

<div class="wrap">

  <div class="card" id="studentCard">
    <h2>👥 ವಿದ್ಯಾರ್ಥಿಗಳು</h2>
    <div class="row" style="margin-bottom:14px;">
      <button class="btn-amber" id="btnAddOne">➕ ಒಬ್ಬೊಬ್ಬರನ್ನಾಗಿ ಸೇರಿಸಿ</button>
      <button class="btn-outline" id="btnPdf">📄 PDF ಮೂಲಕ ಅಪಲೋಡ್</button>
      <input type="file" id="pdfInput" accept="application/pdf" style="display:none;">
      <input type="search" id="searchBox" placeholder="🔍 ಹೆಸರು ಹುಡುಕಿ..." style="min-width:220px;flex:1;">
      <button class="btn-danger" id="btnClearAll">🗑️ ಎಲ್ಲಾ ವಿದ್ಯಾರ್ಥಿಗಳನ್ನು ಅಳಿಸಿ</button>
    </div>
    <div class="class-tabs" id="groupTabs"></div>
    <div class="row" style="margin-bottom:10px;">
      <select id="studentDropdown" style="min-width:260px;flex:1;"></select>
      <button class="btn-danger" id="btnDeleteSelected">✕ ಆಯ್ಕೆಮಾಡಿದ ವಿದ್ಯಾರ್ಥಿಯನ್ನು ಅಳಿಸಿ</button>
    </div>
  </div>

  <div class="card" id="trackCard" style="display:none;">
    <div class="active-bar" id="activeBar"></div>
    <div id="tabContent"></div>
  </div>

  <div class="card placeholder" id="noStudentCard">
    ಮೇಲಿನ ಡ್ರಾಪ್‌ಡೌನ್‌ನಿಂದ ಒಬ್ಬ ವಿದ್ಯಾರ್ಥಿಯನ್ನು ಆಯ್ಕೆಮಾಡಿ, ನಂತರ ಅಕ್ಷರ ಕಲಿಕೆಯ ಪ್ರಗತಿ ದಾಖಲಿಸಬಹುದು.
  </div>

</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ---------------- LETTER GROUPS (ಫೋಟೊದಲ್ಲಿನ ಪ್ರತಿ ಸಾಲು = ಒಂದು ಗುಂಪು) ---------------- */
const GROUPS = [
  { id:1, letters:['अ','ए','ऋ','अं','ऐ','इ','आ','ई'] },
  { id:2, letters:['उ','ओ','अः','ऊ','औ','क','च','ट'] },
  { id:3, letters:['त','प','य','श','ख','छ','ठ'] },
  { id:4, letters:['थ','फ','र','ष','ग','ज','ड'] },
  { id:5, letters:['द','ब','ल','स','घ','झ','ढ'] },
  { id:6, letters:['ध','भ','व','ह','ङ','ञ','ण'] },
  { id:7, letters:['न','म','ऊ','ज्ञ','स','व','य'] },
  { id:8, letters:['प','द','ह','ख','ठ','र','म'] },
];
const MAX_GROUP = GROUPS.length;
function groupById(id){ return GROUPS.find(g=>g.id===id); }

/* ---------------- STATE ---------------- */
let students = [];            // {id, name, cls, group}
let progressCache = {};       // id -> { learned: { groupId: {letterIdx:true} } }
let activeGroupTab = 'all';   // filter: 'all' or a group number 1..8
let activeStudentId = null;
let selectedGroupView = null; // which group is currently shown for the active student

const CLASSES = [1,2,3,4,5,6,7];

function emptyProgress(){
  return { learned: {} };
}

/* ---------------- STORAGE ---------------- */
// Uses window.storage when available (inside Claude.ai artifact panel).
// Falls back to localStorage automatically when the file is opened directly
// in a browser (double-clicked / downloaded), so saving still works there.
const hasCloudStorage = !!(window.storage && typeof window.storage.get === 'function');

async function storageGet(key){
  if(hasCloudStorage){
    try{
      const r = await window.storage.get(key, false);
      return r ? r.value : null;
    }catch(e){ return null; }
  }
  try{ return localStorage.getItem('ht_'+key); }catch(e){ return null; }
}
async function storageSet(key, val){
  if(hasCloudStorage){
    try{ await window.storage.set(key, val, false); return true; }
    catch(e){ console.error('cloud save failed', e); return false; }
  }
  try{ localStorage.setItem('ht_'+key, val); return true; }
  catch(e){ console.error('local save failed', e); return false; }
}

async function loadStudents(){
  try{
    const v = await storageGet('students');
    students = v ? JSON.parse(v) : [];
    // safety: make sure every student has a group (older records / manual edits)
    students.forEach(s=>{ if(!s.group) s.group = 1; });
  }catch(e){ students = []; }
}
async function saveStudents(){
  const ok = await storageSet('students', JSON.stringify(students));
  if(!ok) toast('⚠️ ಸೇವ್ ಆಗಲಿಲ್ಲ, ಮತ್ತೊಮ್ಮೆ ಪ್ರಯತ್ನಿಸಿ');
}
async function loadProgress(id){
  if(progressCache[id]) return progressCache[id];
  try{
    const v = await storageGet('progress_'+id);
    progressCache[id] = v ? JSON.parse(v) : emptyProgress();
  }catch(e){ progressCache[id] = emptyProgress(); }
  return progressCache[id];
}
async function saveProgress(id){
  const ok = await storageSet('progress_'+id, JSON.stringify(progressCache[id]));
  if(!ok) toast('⚠️ ಸೇವ್ ಆಗಲಿಲ್ಲ, ಮತ್ತೊಮ್ಮೆ ಪ್ರಯತ್ನಿಸಿ');
}

/* ---------------- TOAST ---------------- */
function toast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.getElementById('toastRoot').appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}

function escapeHtml(s){ return s.replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ---------------- RENDER: GROUP TABS + STUDENT LIST ---------------- */
function renderGroupTabs(){
  const box = document.getElementById('groupTabs');
  let html = `<div class="class-tab ${activeGroupTab==='all'?'active':''}" data-grp="all">ಎಲ್ಲಾ</div>`;
  GROUPS.forEach(g=>{
    html += `<div class="class-tab ${activeGroupTab===g.id?'active':''}" data-grp="${g.id}">ಗುಂಪು ${g.id}</div>`;
  });
  box.innerHTML = html;
  box.querySelectorAll('.class-tab').forEach(el=>{
    el.onclick = ()=>{ activeGroupTab = el.dataset.grp==='all'?'all':Number(el.dataset.grp); renderStudentList(); };
  });
}

function renderStudentList(){
  const dropdown = document.getElementById('studentDropdown');
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  let list = students;
  if(q){
    list = students.filter(s=>s.name.toLowerCase().includes(q));
  } else if(activeGroupTab!=='all'){
    list = students.filter(s=>s.group===activeGroupTab);
  }

  const sortedForDropdown = [...list].sort((a,b)=>a.name.localeCompare(b.name,'kn'));
  if(sortedForDropdown.length===0){
    dropdown.innerHTML = `<option value="">ಯಾವ ವಿದ್ಯಾರ್ಥಿಗಳೂ ಇಲ್ಲ</option>`;
  } else {
    dropdown.innerHTML = `<option value="">👤 ಹೆಸರು ಆಯ್ಕೆಮಾಡಿ...</option>` +
      sortedForDropdown.map(s=>`<option value="${s.id}" ${s.id===activeStudentId?'selected':''}>${escapeHtml(s.name)} — ${s.cls} ನೇ ತರಗತಿ · ಗುಂಪು ${s.group}</option>`).join('');
  }
  dropdown.onchange = ()=>{
    if(dropdown.value) selectStudent(dropdown.value);
  };
}

document.getElementById('btnDeleteSelected').onclick = async ()=>{
  if(!activeStudentId){ toast('⚠️ ಮೊದಲು ಒಬ್ಬ ವಿದ್ಯಾರ್ಥಿಯನ್ನು ಆಯ್ಕೆಮಾಡಿ'); return; }
  const s = students.find(x=>x.id===activeStudentId);
  if(s && confirm(`"${s.name}" ಅನ್ನು ಪಟ್ಟಿಯಿಂದ ತೆಗೆಯುವುದೇ?`)){
    students = students.filter(x=>x.id!==activeStudentId);
    await saveStudents();
    activeStudentId = null;
    renderTrackArea();
    renderStudentList();
  }
};

async function selectStudent(id){
  activeStudentId = id;
  await loadProgress(id);
  const s = students.find(x=>x.id===id);
  selectedGroupView = s ? s.group : 1;
  renderStudentList();
  renderTrackArea();
}

/* ---------------- ADD STUDENT (ONE BY ONE) ---------------- */
document.getElementById('btnAddOne').onclick = ()=>{
  const modal = document.getElementById('modalRoot');
  modal.innerHTML = `
    <div class="modal-bg">
      <div class="modal">
        <h3>➕ ವಿದ್ಯಾರ್ಥಿಯನ್ನು ಸೇರಿಸಿ</h3>
        <div class="row" style="margin-bottom:12px;">
          <input type="text" id="newName" placeholder="ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು" style="flex:1;min-width:200px;">
          <select id="newCls">${CLASSES.map(c=>`<option value="${c}">${c} ನೇ ತರಗತಿ</option>`).join('')}</select>
        </div>
        <div style="color:var(--chalk-dim);font-size:12.5px;margin-bottom:12px;">
          ಎಲ್ಲಾ ಹೊಸ ವಿದ್ಯಾರ್ಥಿಗಳು ಮೊದಲು ಗುಂಪು 1 ರಲ್ಲಿ ಸೇರುತ್ತಾರೆ — ಅಕ್ಷರಗಳನ್ನು ಕಲಿತ ನಂತರವಷ್ಟೇ ಮುಂದಿನ ಗುಂಪಿಗೆ ಬಡ್ತಿ ಸಿಗುತ್ತದೆ.
        </div>
        <div class="row">
          <button class="btn-amber" id="confirmAdd">ಸೇರಿಸಿ</button>
          <button class="btn-ghost" id="cancelAdd">ರದ್ದು</button>
        </div>
      </div>
    </div>`;
  document.getElementById('cancelAdd').onclick = ()=> modal.innerHTML='';
  document.getElementById('confirmAdd').onclick = async ()=>{
    const name = document.getElementById('newName').value.trim();
    const cls = Number(document.getElementById('newCls').value);
    if(!name){ toast('ಹೆಸರು ನಮೂದಿಸಿ'); return; }
    students.push({id:'s_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), name, cls, group:1});
    await saveStudents();
    modal.innerHTML='';
    renderStudentList();
    toast(`${name} ಸೇರಿಸಲಾಗಿದೆ`);
  };
  document.getElementById('newName').focus();
};

document.getElementById('searchBox').oninput = renderStudentList;

document.getElementById('btnClearAll').onclick = async ()=>{
  if(students.length===0){ toast('ಪಟ್ಟಿ ಈಗಾಗಲೇ ಖಾಲಿ ಇದೆ'); return; }
  if(confirm('ಎಲ್ಲಾ ವಿದ್ಯಾರ್ಥಿಗಳನ್ನು ಪಟ್ಟಿಯಿಂದ ಶಾಶ್ವತವಾಗಿ ಅಳಿಸುವುದೇ? (ಇದನ್ನು ರದ್ದುಗೊಳಿಸಲಾಗುವುದಿಲ್ಲ)')){
    students = [];
    activeStudentId = null;
    activeGroupTab = 'all';
    document.getElementById('searchBox').value = '';
    await saveStudents();
    renderGroupTabs();
    renderStudentList();
    renderTrackArea();
    toast('ಎಲ್ಲಾ ವಿದ್ಯಾರ್ಥಿಗಳನ್ನು ಅಳಿಸಲಾಗಿದೆ');
  }
};

/* ---------------- PDF UPLOAD (table-aware: Student Name + Standard only) ---------------- */
document.getElementById('btnPdf').onclick = ()=> document.getElementById('pdfInput').click();
document.getElementById('pdfInput').onchange = async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  toast('PDF ಓದಲಾಗುತ್ತಿದೆ...');
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data:buf}).promise;

    let bounds = null;
    let rowsOut = [];
    let fallbackLines = [];

    let expectedSerial = 1;
    let currentRowItems = null;

    function flushRow(){
      if(currentRowItems && bounds){
        const nameCell = extractCell(currentRowItems, bounds.nameStart, bounds.nameEnd).trim();
        const stdCell = extractCell(currentRowItems, bounds.stdStart, bounds.stdEnd).trim();
        if(nameCell){
          rowsOut.push({ name: nameCell, rawStd: stdCell, cls: parseStandard(stdCell) });
        }
      }
      currentRowItems = null;
    }

    for(let p=1;p<=pdf.numPages;p++){
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      const rowsMap = {};
      content.items.forEach(it=>{
        const y = Math.round(it.transform[5]);
        if(!rowsMap[y]) rowsMap[y]=[];
        rowsMap[y].push({x:it.transform[4], str:it.str});
      });
      const ys = Object.keys(rowsMap).map(Number).sort((a,b)=>b-a);
      ys.forEach(y=>{
        const items = rowsMap[y].sort((a,b)=>a.x-b.x);
        const rowText = items.map(i=>i.str).join(' ').toLowerCase();
        if(!rowText.trim()) return;
        fallbackLines.push(items.map(i=>i.str).join(' ').trim());

        const looksLikeHeader = rowText.includes('student') && rowText.includes('standard');
        if(!bounds){
          if(looksLikeHeader){ bounds = computeColumnBounds(items); expectedSerial = 1; }
          return;
        }
        if(looksLikeHeader){ flushRow(); return; }

        const first = items.find(i=>i.str.trim()!=='');
        const isRowStart = first
          && /^\d+$/.test(first.str.trim())
          && Number(first.str.trim()) === expectedSerial
          && first.x < bounds.nameStart;

        if(isRowStart){
          flushRow();
          currentRowItems = items.slice();
          expectedSerial++;
        } else if(currentRowItems){
          currentRowItems.push(...items);
        }
      });
    }
    flushRow();

    if(bounds && rowsOut.length>0){
      openPdfPreviewTable(rowsOut);
    }else{
      pdfExtracted = fallbackLines
        .map(l=>l.replace(/^\s*\d+[\.\)\-]?\s*/,'').replace(/\s+/g,' ').trim())
        .filter(l=>l.length>1 && l.length<60);
      if(pdfExtracted.length===0){
        toast('ಹೆಸರುಗಳು ಪತ್ತೆಯಾಗಲಿಲ್ಲ');
        return;
      }
      toast('ಟೇಬಲ್ ಶೀರ್ಷಿಕೆ ಸಿಗಲಿಲ್ಲ — ಸಾಮಾನ್ಯ ಪಟ್ಟಿಯಾಗಿ ತೋರಿಸಲಾಗುತ್ತಿದೆ');
      openPdfPreviewSimple();
    }
  }catch(err){
    console.error(err);
    toast('PDF ಓದುವಲ್ಲಿ ದೋಷ');
  }finally{
    e.target.value = '';
  }
};

let pdfExtracted = [];

function computeColumnBounds(headerItems){
  const toks = headerItems.map(i=>({x:i.x, s:i.str.toLowerCase()}));
  function xOf(keyword){
    const t = toks.find(t=>t.s.includes(keyword));
    return t ? t.x : null;
  }
  const studentX = xOf('student') ?? xOf('name');
  const dobX = xOf('birth') ?? xOf('dob');
  const standardX = xOf('standard') ?? xOf('class') ?? xOf('std');
  const talukaX = xOf('taluka');

  const nameStart = (studentX!=null ? studentX : 0) - 2;
  const nameEnd = (dobX!=null ? dobX : (standardX!=null ? standardX : nameStart+250)) - 2;
  const stdStart = (standardX!=null ? standardX : nameEnd) - 12;
  const stdEnd = (talukaX!=null ? talukaX : stdStart+150) + 10;
  return { nameStart, nameEnd, stdStart, stdEnd };
}

function extractCell(items, startX, endX){
  return items.filter(i=>i.x>=startX && i.x<endX).sort((a,b)=>a.x-b.x).map(i=>i.str).join(' ').replace(/\s+/g,' ').trim();
}

function parseStandard(text){
  if(!text) return null;
  const t = text.toLowerCase().trim();
  const digitMatch = t.match(/\d+/);
  if(digitMatch){
    const n = parseInt(digitMatch[0],10);
    if(n>=1 && n<=7) return n;
  }
  const roman = {i:1, ii:2, iii:3, iv:4, v:5, vi:6, vii:7};
  const cleaned = t.replace(/[^a-z]/g,'');
  if(roman[cleaned]) return roman[cleaned];
  return null;
}

/* ---------------- TRACK AREA (ಅಕ್ಷರ ಗುಂಪುಗಳು) ---------------- */
function renderTrackArea(){
  const trackCard = document.getElementById('trackCard');
  const noCard = document.getElementById('noStudentCard');
  if(!activeStudentId){
    trackCard.style.display='none';
    noCard.style.display='block';
    return;
  }
  trackCard.style.display='block';
  noCard.style.display='none';
  const s = students.find(x=>x.id===activeStudentId);
  document.getElementById('activeBar').innerHTML = `
    <span class="name">🎯 ${escapeHtml(s.name)}</span>
    <span class="cls-badge">${s.cls} ನೇ ತರಗತಿ</span>
    <span class="group-badge">ಈಗಿನ ಗುಂಪು: ${s.group}</span>
  `;
  renderTabContent(s);
}

function renderTabContent(s){
  const el = document.getElementById('tabContent');
  if(!selectedGroupView) selectedGroupView = s.group;

  // group navigation pills: locked (🔒) beyond the student's current group
  let navHtml = '<div class="group-nav">';
  GROUPS.forEach(g=>{
    const locked = g.id > s.group;
    const done = isGroupFullyLearned(s.id, g.id);
    navHtml += `<button class="group-pill ${selectedGroupView===g.id?'active':''} ${done?'done':''}" data-g="${g.id}" ${locked?'disabled':''}>
      ${locked?'🔒 ':''}ಗುಂಪು ${g.id}${done?' ✅':''}
    </button>`;
  });
  navHtml += '</div>';

  const g = groupById(selectedGroupView);
  const learned = getLearnedMap(s.id, g.id);
  const learnedCount = g.letters.filter((_,i)=>learned[i]).length;
  const total = g.letters.length;
  const fullyLearned = learnedCount === total;

  let tilesHtml = '<div class="letter-grid">';
  g.letters.forEach((ltr,i)=>{
    const cls = learned[i] ? 'green' : '';
    tilesHtml += `<button class="letter-tile ${cls}" data-i="${i}">${ltr}</button>`;
  });
  tilesHtml += '</div>';

  let promoHtml = '';
  if(selectedGroupView === s.group){
    if(s.group < MAX_GROUP){
      if(fullyLearned){
        promoHtml = `
          <div class="promo-box">
            <p>🎉 ಗುಂಪು ${s.group} ರ ಎಲ್ಲಾ ಅಕ್ಷರಗಳನ್ನು ಕಲಿತಿದ್ದಾರೆ!</p>
            <button class="btn-green" id="btnPromote">➡️ ಗುಂಪು ${s.group+1} ಗೆ ಬಡ್ತಿ ನೀಡಿ</button>
          </div>`;
      } else {
        promoHtml = `
          <div class="promo-box locked">
            <p>🔒 ಗುಂಪು ${s.group+1} ಗೆ ಹೋಗಬೇಕಾದರೆ ಈ ಗುಂಪಿನ ಎಲ್ಲಾ ಅಕ್ಷರಗಳನ್ನು (${learnedCount}/${total}) ಕಲಿಯಬೇಕು.</p>
          </div>`;
      }
    } else {
      promoHtml = `
        <div class="promo-box">
          <p>🏆 ಎಲ್ಲಾ ಗುಂಪುಗಳನ್ನು ತಲುಪಿದ್ದಾರೆ!</p>
        </div>`;
    }
    if(s.group > 1){
      promoHtml += `<div class="row" style="margin-bottom:16px;"><button class="btn-ghost" id="btnDemote">↩️ ಹಿಂದಿನ ಗುಂಪಿಗೆ ಹಿಂತಿರುಗಿಸಿ (ಗುಂಪು ${s.group-1})</button></div>`;
    }
  }

  el.innerHTML = `
    ${navHtml}
    <div class="progress-note">ಗುಂಪು ${g.id} ರಲ್ಲಿ ಕಲಿತದ್ದು: <b>${learnedCount} / ${total}</b> &nbsp; — ಅಕ್ಷರದ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ 🟩 ಕಲಿತಿದೆ / 🟥 ಇನ್ನೂ ಇಲ್ಲ ಎಂದು ಗುರುತಿಸಿ</div>
    ${tilesHtml}
    ${promoHtml}
  `;

  el.querySelectorAll('.group-pill').forEach(b=>{
    if(b.disabled) return;
    b.onclick = ()=>{ selectedGroupView = Number(b.dataset.g); renderTabContent(s); };
  });

  el.querySelectorAll('.letter-tile').forEach(b=>{
    b.onclick = async ()=>{
      const i = Number(b.dataset.i);
      const map = getLearnedMap(s.id, g.id);
      map[i] = !map[i];
      if(!map[i]) delete map[i];
      setLearnedMap(s.id, g.id, map);
      await saveProgress(s.id);
      renderTabContent(s);
    };
  });

  const promoteBtn = document.getElementById('btnPromote');
  if(promoteBtn){
    promoteBtn.onclick = async ()=>{
      s.group += 1;
      await saveStudents();
      selectedGroupView = s.group;
      renderTrackArea();
      renderStudentList();
      toast(`🎉 ${s.name} ಈಗ ಗುಂಪು ${s.group} ಗೆ ಬಡ್ತಿ ಪಡೆದಿದ್ದಾರೆ!`);
    };
  }
  const demoteBtn = document.getElementById('btnDemote');
  if(demoteBtn){
    demoteBtn.onclick = async ()=>{
      s.group -= 1;
      await saveStudents();
      selectedGroupView = s.group;
      renderTrackArea();
      renderStudentList();
      toast(`↩️ ${s.name} ಗುಂಪು ${s.group} ಗೆ ಹಿಂತಿರುಗಿದ್ದಾರೆ`);
    };
  }
}

function getLearnedMap(studentId, groupId){
  const p = progressCache[studentId];
  if(!p.learned[groupId]) p.learned[groupId] = {};
  return p.learned[groupId];
}
function setLearnedMap(studentId, groupId, map){
  progressCache[studentId].learned[groupId] = map;
}
function isGroupFullyLearned(studentId, groupId){
  const p = progressCache[studentId];
  if(!p) return false;
  const map = p.learned[groupId] || {};
  const g = groupById(groupId);
  return g.letters.every((_,i)=>map[i]);
}

(async function init(){
  await loadStudents();
  renderGroupTabs();
  renderStudentList();
  renderTrackArea();
})();
